<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0B0D12" />
<meta name="description" content="GAME OF THE WITCHER — bilingual geopolitical strategy (frontend demo)." />
<title>GAME OF THE WITCHER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B0D12'/%3E%3Cpath d='M18 44 L26 20 L32 34 L38 20 L46 44 Z' fill='%2342D9FF'/%3E%3C/svg%3E" />
<style>
:root{
  --bg:#0B0D12; --surface:#131722; --surface2:#191F2C;
  --primary:#42D9FF; --secondary:#8B7CFF;
  --success:#34D399; --warning:#F5A623; --error:#EF4444;
  --text:#fff; --muted:#8A93A6; --border:#232A38;
  --radius:12px; --radius-sm:8px;
  --font:"Vazirmatn",Tahoma,Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0 0 8px}
h1{font-size:22px}h2{font-size:18px}h3{font-size:16px}h4{font-size:14px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)}
.small{font-size:12px}
.hint{color:var(--muted);font-size:12px;margin-top:8px}
.mt-8{margin-top:8px}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}

#boot-error{display:none;position:fixed;top:0;left:0;right:0;background:#EF4444;color:#fff;padding:10px 14px;z-index:99999;font-family:monospace;font-size:12px;white-space:pre-wrap}

.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(1200px 600px at 50% -10%,rgba(66,217,255,.08),transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.brand-line{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.brand-line .mark{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;color:#04121a;font-weight:800}
.brand-line strong{letter-spacing:.5px}
.auth-tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.auth-tab{flex:1;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--muted);font-size:13px}
.auth-tab.active{background:var(--primary);color:#04121a;border-color:var(--primary);font-weight:700}
.form label,.auth-card label{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.form input,.form textarea,.form select,.auth-card input,.auth-card select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:14px;width:100%}
.form textarea{min-height:100px;resize:vertical}
.error-text{color:var(--error);font-size:13px;margin-top:8px}
.warn-banner{margin-top:12px;padding:10px;border:1px solid rgba(245,166,35,.35);background:rgba(245,166,35,.06);color:var(--warning);font-size:12px;border-radius:var(--radius-sm)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;transition:background .15s,border-color .15s}
.btn:hover{background:#20283a}
.btn-primary{background:var(--primary);color:#04121a;border-color:var(--primary);font-weight:700}
.btn-primary:hover{background:#5fe2ff}
.btn-danger{border-color:rgba(239,68,68,.4);color:#ff8d8d}
.btn-ghost{background:transparent}
.btn-block{width:100%;justify-content:center}

.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-inline-end:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.sidebar .brand .mark{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;font-weight:800;color:#04121a}
.sidebar .brand strong{font-size:13px;letter-spacing:.5px}
.demo-banner{font-size:11px;text-align:center}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--muted);text-align:start;font-size:13px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(66,217,255,.1);color:var(--primary);font-weight:600}
.pill{background:var(--error);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;min-width:18px;text-align:center}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.menu-btn{display:none}
.topbar-title{flex:1;min-width:0}
.topbar-title h2{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.resource-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:12px}
.chip-icon{font-size:13px}
.lang-btn{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);font-size:12px;color:var(--muted)}
.lang-btn.active{background:var(--primary);color:#04121a;border-color:var(--primary);font-weight:700}
.icon-btn{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border)}
.dot{position:absolute;top:6px;inset-inline-end:6px;width:8px;height:8px;border-radius:50%;background:var(--error)}

.view{padding:20px;max-width:1200px;width:100%;margin:0 auto}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h3,.card h4{margin-bottom:10px}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid-stats{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:16px}
.stat{display:flex;align-items:center;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.stat-icon{font-size:20px}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.stat-value{font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip-btn{cursor:pointer}
.chip-btn.active{background:var(--primary);color:#04121a;border-color:var(--primary);font-weight:700}
.badge{display:inline-block;padding:2px 8px;font-size:11px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.badge-success{border-color:rgba(52,211,153,.4);color:var(--success);background:rgba(52,211,153,.08)}
.badge-warn{border-color:rgba(245,166,35,.4);color:var(--warning);background:rgba(245,166,35,.08)}
.badge-error{border-color:rgba(239,68,68,.4);color:var(--error);background:rgba(239,68,68,.08)}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:var(--radius-sm)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.simple-list{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.simple-list li{padding:10px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.item-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;flex-wrap:wrap}
.item-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:700;color:var(--primary)}

.post-form{display:flex;flex-direction:column;gap:8px}
.post-form textarea,.post-form input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;min-height:80px;resize:vertical}
.post-form input[type=text]{min-height:auto}
.post-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.post{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.post-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.post-body{white-space:pre-wrap;margin:0 0 10px}
.post-actions .btn{font-size:12px;padding:4px 8px}

.chat{max-height:260px;overflow-y:auto;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px}
.chat-msg{padding:6px 0;border-bottom:1px dashed var(--border)}
.chat-msg:last-child{border-bottom:none}
.chat-msg p{margin:4px 0 0;font-size:13px;white-space:pre-wrap}

.ai-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ai-history{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.ai-entry{padding:10px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.ai-user{font-size:13px;color:var(--primary);margin-bottom:6px;white-space:pre-wrap}
.ai-response strong{display:block;margin-bottom:4px}
.ai-response p{margin:0;font-size:13px;white-space:pre-wrap}

.country-pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.country-pick-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px}
.country-pick-card.claimed{opacity:.55}
.country-pick-head{display:flex;align-items:center;gap:8px}
.country-pick-head .flag{font-size:22px}
.country-pick-head strong{font-size:14px}
.country-pick-card .desc{font-size:12px;color:var(--muted);min-height:34px}
.country-pick-card .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px}

#toast-region{position:fixed;bottom:16px;inset-inline-end:16px;display:flex;flex-direction:column;gap:8px;z-index:1000;max-width:90vw}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:opacity .3s}
.toast-success{border-inline-start:3px solid var(--success)}
.toast-error{border-inline-start:3px solid var(--error)}
.toast-info{border-inline-start:3px solid var(--primary)}
.toast-out{opacity:0}

.mobile-nav{display:none;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--border);z-index:30;padding:4px;justify-content:space-around}
.mobile-nav-item{padding:8px 4px;color:var(--muted);font-size:11px;flex:1;text-align:center;border-radius:var(--radius-sm)}
.mobile-nav-item.active{color:var(--primary)}
.mobile-label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-backdrop{display:none}

@media (max-width:840px){
  .shell{grid-template-columns:1fr;padding-bottom:64px}
  .menu-btn{display:grid}
  .sidebar{position:fixed;inset-inline-start:0;top:0;bottom:0;width:260px;transform:translateX(-110%);transition:transform .25s;z-index:40;height:100vh}
  [dir="rtl"] .sidebar{transform:translateX(110%);inset-inline-start:0;inset-inline-end:auto}
  .shell.sidebar-open .sidebar{transform:translateX(0)}
  .shell.sidebar-open .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  .mobile-nav{display:flex}
  .view{padding:12px;padding-bottom:80px}
  .resource-chips{display:none}
  .topbar{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      el.style.display = 'block';
      el.textContent = 'GAME OF THE WITCHER — error: ' + (e.message || 'unknown') +

    }
  });
})();
</script>

/* ---------- i18n ---------- */
var LANG = (function(){
  try { var s = localStorage.getItem("gotw-lang-v1"); if (s === "fa" || s === "en") return s; } catch(e){}
  var nav = (navigator.language || "fa").toLowerCase();
  return nav.indexOf("en") === 0 ? "en" : "fa";
})();

function t(key, vars){
  var faRow = (T[LANG]) ? T[LANG][key] : undefined;
  var val;
  if (faRow !== undefined && faRow !== null) val = faRow;
  else {
    var enRow = T.en[key];
    val = (enRow !== undefined && enRow !== null) ? enRow : key;
  }
  if (!vars) return val;
  return String(val).replace(/\{(\w+)\}/g, function(_, k){
    return (vars[k] !== undefined && vars[k] !== null) ? String(vars[k]) : "{" + k + "}";
  });
}
function L(v){
  if (v && typeof v === "object"){
    if (v[LANG] !== undefined && v[LANG] !== null) return v[LANG];
    if (v.en !== undefined && v.en !== null) return v.en;
    return "";
  }
  return String(v !== undefined && v !== null ? v : "");
}
function applyLang(){
  document.documentElement.lang = LANG === "fa" ? "fa-IR" : "en-US";
  document.documentElement.dir = LANG === "fa" ? "rtl" : "ltr";
  try { localStorage.setItem("gotw-lang-v1", LANG); } catch(e){}
}
function fmt(n){
  try { return new Intl.NumberFormat(LANG === "fa" ? "fa-IR" : "en-US").format(n); }
  catch(e){ return String(n); }
}
function fmtCur(n){ return fmt(n) + " " + (LANG === "fa" ? "سکه" : "GC"); }
function fmtDate(ts){
  try {
    return new Intl.DateTimeFormat(LANG === "fa" ? "fa-IR" : "en-US", {dateStyle:"medium",timeStyle:"short"}).format(new Date(ts));
  } catch(e){ return new Date(ts).toLocaleString(); }
}
function esc(s){
  var str = String(s !== undefined && s !== null ? s : "");
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---------- Storage ---------- */
var USERS_KEY = "gotw-users-v1";
var SESSION_KEY = "gotw-session-v1";

function safeParse(raw, fallback){
  try { var v = JSON.parse(raw); return (v && typeof v === "object") ? v : fallback; }
  catch(e){ return fallback; }
}
function loadUsers(){
  try { return safeParse(localStorage.getItem(USERS_KEY), {}); }
  catch(e){ return {}; }
}
function saveUsers(users){
  try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }
  catch(e){ console.warn("GOTW save failed", e); }
}
function getSession(){
  try { return localStorage.getItem(SESSION_KEY) || null; }
  catch(e){ return null; }
}
function setSession(u){
  try {
    if (u) localStorage.setItem(SESSION_KEY, u);
    else localStorage.removeItem(SESSION_KEY);
  } catch(e){}
}
function pwdHash(pwd){
  try { return btoa(unescape(encodeURIComponent("gotw::" + pwd))); }
  catch(e){ return "x"; }
}

function makeInitialUser(username, pwd){
  return {
    username: username,
    pwdHash: pwdHash(pwd),
    createdAt: Date.now(),
    countryId: null,
    treasury: 1000000,
    mines: [],
    inventory: [],
    transactions: [],
    posts: [],
    warProposals: [],
    votes: {},
    allianceId: null,
    allianceMessages: [],
    notifications: [{
      id: "n-welcome-" + Date.now(),
      type: "system",
      read: false,
      title: {fa:"خوش آمدید",en:"Welcome"},
      body: {fa:"حساب شما ساخته شد. یک کشور انتخاب کنید.",en:"Your account is ready. Choose a country."},
      createdAt: Date.now()
    }],
    aiHistory: [],
    lastPayoutDate: null,
    settings: {theme:"dark"}
  };
}

function getClaims(){
  var users = loadUsers();
  var map = {};
  var list = Object.keys(users).map(function(k){ return users[k]; });
  for (var i = 0; i < list.length; i++){
    var u = list[i];
    if (u && u.countryId) map[u.countryId] = u.username;
  }
  return map;
}
function isCountryClaimedBy(countryId, username){
  var claims = getClaims();
  return !!claims[countryId] && claims[countryId] !== username;
}

  App.claims = getClaims();
}
function loadCurrentFromSession(){
  var username = getSession();
  if (!username) return null;
  var users = loadUsers();

  if (!u){ setSession(null); return null; }
  return u;

/* ---------- Toast ---------- */
function toast(msg, kind){
  kind = kind || "info";
  var region = document.getElementById("toast-region");
  if (!region) return;
  var el = document.createElement("div");
  el.className = "toast toast-" + kind;
  el.textContent = msg;
  region.appendChild(el);
  setTimeout(function(){ el.classList.add("toast-out"); }, 2600);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 3200);
}

function addNotif(user, type, title, body){
  user.notifications.unshift({
    id: "n-" + Date.now() + "-" + Math.random().toString(36).slice(2,6),
    type: type, read: false,
    title: (typeof title === "string") ? {fa:title,en:title} : title,
    body: (typeof body === "string") ? {fa:body,en:body} : body,
    createdAt: Date.now()
  });
  if (user.notifications.length > 200) user.notifications.length = 200;
}
function addTx(user, kind, amount, note){
  user.transactions.unshift({
    id: "tx-" + Date.now() + "-" + Math.random().toString(36).slice(2,6),
    kind: kind, amount: amount, note: note, createdAt: Date.now()
  });
  if (user.transactions.length > 200) user.transactions.length = 200;
}

/* ---------- Render helpers ---------- */
function card(inner, cls){ return '<div class="card ' + (cls||"") + '">' + inner + '</div>'; }
function stat(label, value, icon){
  return '<div class="stat"><div class="stat-icon">' + (icon||"") + '</div><div class="stat-body"><div class="stat-label">' + esc(label) + '</div><div class="stat-value">' + esc(value) + '</div></div></div>';
}
function religionOf(id){ return RELIGIONS[id] || RELIGIONS.mixed; }
function eraOf(id){ return ERAS[id] || ERAS.modern; }
function myCountry(){
  if (!App.user) return null;
  for (var i = 0; i < COUNTRIES.length; i++){
    if (COUNTRIES[i].id === App.user.countryId) return COUNTRIES[i];
  }
  return null;
}
function findCountry(id){
  for (var i = 0; i < COUNTRIES.length; i++){
    if (COUNTRIES[i].id === id) return COUNTRIES[i];
  }
  return null;
}
function findAlliance(id){
  for (var i = 0; i < ALLIANCES.length; i++){
    if (ALLIANCES[i].id === id) return ALLIANCES[i];
  }
  return null;
}
function findMine(id){
  for (var i = 0; i < MINES.length; i++) if (MINES[i].id === id) return MINES[i];
  return null;
}
function findProduct(id){
  for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i];
  return null;
}

function hydratePosts(){
  var view = document.getElementById("view");
  if (!view) return;
  var u = App.user;
  var all = u.posts.concat(getSeedPosts()).sort(function(a,b){ return b.createdAt - a.createdAt; });
  var nodes = view.querySelectorAll(".post");
  for (var i = 0; i < nodes.length; i++){
    var p = all[i];
    if (!p) continue;
    var target = nodes[i].querySelector("[data-text]");
    if (!target) continue;
    var text = "";
    if (typeof p.text === "string") text = p.text;
    else if (p.text && p.text[LANG]) text = p.text[LANG];
    else if (p.text && p.text.en) text = p.text.en;
    target.textContent = text;
  }
}

function localAdvisor(assistant, prompt){
  var u = App.user, c = myCountry();
  var fa = (LANG === "fa");
  var rel = c ? religionOf(c.religion) : RELIGIONS.mixed;
  if (assistant === "strategy"){
    return {
      title: fa ? "تحلیل راهبردی" : "Strategic analysis",
      body: fa
        ? 'کشور شما (' + (c ? L(c.name) : "—") + ') با دین ' + L(rel) + ' در دوره ' + (c ? L(eraOf(c.era)) : "—") + '، خزانه ' + fmtCur(u.treasury) + ' و ' + u.mines.length + ' معدن فعال. پیشنهاد: دیپلماسی، سپس تقویت اقتصاد.'
        : 'Your country (' + (c ? L(c.name) : "—") + ') — religion ' + L(rel) + ', era ' + (c ? L(eraOf(c.era)) : "—") + ', treasury ' + fmtCur(u.treasury) + ', ' + u.mines.length + ' active mines. Suggestion: diplomacy first, then economy.'
    };
  }
  if (assistant === "defense"){
    var upkeep = 0;
    for (var i = 0; i < u.inventory.length; i++){
      var inv = u.inventory[i];
      var prod = findProduct(inv.productId);
      if (prod && prod.upkeep) upkeep += prod.upkeep * inv.quantity;
    }
    return {
      title: fa ? "تحلیل دفاعی" : "Defense analysis",
      body: fa
        ? 'نگهداری روزانه تقریباً ' + fmtCur(upkeep) + '. ' + (u.treasury < 200000 ? "با خزانه پایین خرید سنگین را به تعویق بیندازید." : "خرید تجهیزات دفاعی هوشمندانه است.")
        : 'Daily upkeep ~' + fmtCur(upkeep) + '. ' + (u.treasury < 200000 ? "Defer heavy purchases due to low treasury." : "Adding defensive equipment is reasonable.")
    };
  }
  return {
    title: fa ? "تحلیل شورا" : "Council analysis",
    body: fa
      ? RESOLUTIONS.length + ' قطعنامه در جریان. پیش از رأی، خلاصه هر یک را بخوانید.'
      : RESOLUTIONS.length + ' resolutions open. Review each summary before voting.'
  };
}

function render(){
  applyLang();
  var app = document.getElementById("app");
  if (!app) return;
  if (!App.user){
    app.innerHTML = renderAuth();
    bindCommon();
    return;
  }
  if (!App.user.countryId){
    app.innerHTML = renderCountryPicker();
    bindCommon();
    return;
  }
  app.innerHTML = renderShell();
  var view = document.getElementById("view");
  if (view){
    var fn = VIEWS[App.route] || VIEWS.overview;
    view.innerHTML = fn();
    if (App.route === "social") hydratePosts();
    if (App.route === "alliances") hydrateChat();
    if (App.route === "ai") hydrateAI();
  }
  bindCommon();
}

/* ============================================================
   EVENTS
   ============================================================ */
var boundOnce = false;

function bindCommon(){
  if (boundOnce) return;
  boundOnce = true;
  var app = document.getElementById("app");
  if (!app) return;

  app.addEventListener("click", function(ev){
    var btn = ev.target.closest("[data-action]");
    if (!btn) return;
    var a = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");
    var route = btn.getAttribute("data-route");
    var lang = btn.getAttribute("data-lang");
    var mode = btn.getAttribute("data-mode");
    var cat = btn.getAttribute("data-cat");
    var choice = btn.getAttribute("data-choice");
    var era = btn.getAttribute("data-era");
    var promptAttr = btn.getAttribute("data-prompt");

    if (a === "lang"){ LANG = lang; applyLang(); if (App.user) persistCurrent(); render(); return; }
    if (a === "toggle-menu"){ var sh = document.getElementById("shell"); if (sh) sh.classList.toggle("sidebar-open"); return; }
    if (a === "logout"){ setSession(null); App.user = null; App.route = "overview"; render(); return; }
    if (a === "auth-mode"){ authMode = mode; render(); return; }
    if (a === "route"){ App.route = route; render(); return; }
    if (a === "picker-era"){ App.pickerEra = era; render(); return; }

    if (!App.user) return;

    if (a === "claim"){
      var country = findCountry(id);
      if (!country) return;
      if (isCountryClaimedBy(id, App.user.username)){ toast(t("countryLocked"), "error"); return; }
      App.user.countryId = id;
      persistCurrent();
      toast(t("countryClaimed"), "success");
      render();
      return;
    }
    if (a === "resume"){ render(); return; }
    if (a === "payout"){
      var today = new Date().toISOString().slice(0,10);
      if (App.user.lastPayoutDate === today){ toast(t("todayDone"), "error"); return; }
      var income = 0, expense = 0;
      for (var i = 0; i < App.user.mines.length; i++){
        var m = findMine(App.user.mines[i].id);
        if (!m) continue;
        income += m.dailyIncome;
        expense += m.maintenance;
      }
      for (var j = 0; j < App.user.inventory.length; j++){
        var inv = App.user.inventory[j];
        var prod = findProduct(inv.productId);
        if (prod && prod.upkeep) expense += prod.upkeep * inv.quantity;
      }
      var net = income - expense;
      App.user.treasury += net;
      App.user.lastPayoutDate = today;
      addTx(App.user, net >= 0 ? "income" : "expense", Math.abs(net), "daily-payout");
      addNotif(App.user, "payout", "Daily payout", "net: " + net);
      persistCurrent();
      toast(t("payoutOk"), "success");
      render();
      return;
    }
    if (a === "buy-mine"){
      var mine = findMine(id);
      if (!mine) return;
      var owned = false;
      for (var k = 0; k < App.user.mines.length; k++) if (App.user.mines[k].id === id) owned = true;
      if (owned){ toast(t("alreadyOwned"), "error"); return; }
      if (App.user.treasury < mine.price){ toast(t("insufficient"), "error"); return; }
      App.user.treasury -= mine.price;
      App.user.mines.push({id: mine.id, at: Date.now()});
      addTx(App.user, "expense", mine.price, "mine:" + mine.id);
      addNotif(App.user, "purchase", "Mine purchased", L(mine.name));
      persistCurrent();
      toast(t("success"), "success");
      render();
      return;
    }
    if (a === "market-cat"){ App.categoryFilter = cat; render(); return; }
    if (a === "buy-product"){
      var product = findProduct(id);
      if (!product) return;
      if (App.user.treasury < product.price){ toast(t("insufficient"), "error"); return; }
      var existing = null;
      for (var kk = 0; kk < App.user.inventory.length; kk++) if (App.user.inventory[kk].productId === id) existing = App.user.inventory[kk];
      if (existing && product.category !== "cosmetic"){ toast(t("alreadyOwned"), "error"); return; }
      App.user.treasury -= product.price;
      if (existing) existing.quantity += 1;
      else App.user.inventory.push({productId: id, quantity: 1, at: Date.now()});
      addTx(App.user, "expense", product.price, "product:" + product.id);
      addNotif(App.user, "purchase", "Purchase", L(product.name));
      persistCurrent();
      toast(t("success"), "success");
      render();
      return;
    }
    if (a === "like-post"){
      for (var p = 0; p < App.user.posts.length; p++){
        if (App.user.posts[p].id === id){
          var post = App.user.posts[p];
          post.likedByMe = !post.likedByMe;
          post.likes = (post.likes || 0) + (post.likedByMe ? 1 : -1);
          break;
        }
      }
      persistCurrent();
      render();
      return;
    }
    if (a === "del-post"){
      App.user.posts = App.user.posts.filter(function(p){ return p.id !== id; });
      persistCurrent();
      render();
      return;
    }
    if (a === "war-approve" || a === "war-reject"){
      for (var w = 0; w < App.user.warProposals.length; w++){
        var wp = App.user.warProposals[w];
        if (wp.id === id && wp.status === "pending"){
          wp.status = (a === "war-approve") ? "approved" : "rejected";
          wp.history = wp.history || [];
          wp.history.push({at: Date.now(), status: wp.status});
          addNotif(App.user, "war", "War proposal update", wp.status);
          break;
        }
      }
      persistCurrent();
      render();
      return;
    }
    if (a === "vote"){
      if (App.user.votes[id + "::mine"]){ toast(t("alreadyVoted"), "error"); return; }
      App.user.votes[id + "::mine"] = choice;
      if (!App.user.votes[id]) App.user.votes[id] = {yes:0,no:0,abstain:0};
      App.user.votes[id][choice] = (App.user.votes[id][choice] || 0) + 1;
      addNotif(App.user, "council", "Vote recorded", id + ": " + choice);
      persistCurrent();
      toast(t("voted"), "success");
      render();
      return;
    }
    if (a === "join-alliance"){ App.user.allianceId = id; persistCurrent(); toast(t("joined"), "success"); render(); return; }
    if (a === "leave-alliance"){ App.user.allianceId = null; persistCurrent(); toast(t("left"), "success"); render(); return; }
    if (a === "ai-assistant"){ App.aiAssistant = id; render(); return; }
    if (a === "ai-prompt"){
      var res = localAdvisor(App.aiAssistant, promptAttr);
      App.user.aiHistory.push({assistant: App.aiAssistant, prompt: promptAttr, response: res, at: Date.now()});
      persistCurrent();
      render();
      return;
    }
    if (a === "ai-clear"){ App.user.aiHistory = []; persistCurrent(); render(); return; }
    if (a === "notif-mark-all"){ for (var n = 0; n < App.user.notifications.length; n++) App.user.notifications[n].read = true; persistCurrent(); render(); return; }
    if (a === "notif-clear"){ App.user.notifications = []; persistCurrent(); render(); return; }
    if (a === "export"){
      try {
        var blob = new Blob([JSON.stringify(App.user, null, 2)], {type: "application/json"});
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = "gotw-" + App.user.username + ".json";
        link.click();
        URL.revokeObjectURL(url);
      } catch(e){ toast(t("err"), "error"); }
      return;
    }
    if (a === "reset-all"){
      if (!confirm(t("resetConfirm"))) return;
      try { localStorage.removeItem(USERS_KEY); localStorage.removeItem(SESSION_KEY); } catch(e){}
      App.user = null;
      App.claims = {};
      App.route = "overview";
      toast(t("resetDone"), "success");
      render();
      return;
    }
  });

  app.addEventListener("submit", function(ev){
    var form = ev.target.closest("form[data-form]");
    if (!form) return;
    ev.preventDefault();
    var kind = form.getAttribute("data-form");

    if (kind === "auth"){
      var username = (form.username.value || "").trim();
      var password = form.password.value || "";
      var errEl = form.querySelector("[data-error]");
      var fail = function(msg){ if (errEl){ errEl.textContent = msg; errEl.hidden = false; } };
      if (!username || !password) return fail(t("authRequired"));
      if (password.length < 4) return fail(t("authWeak"));
      if (!/^[A-Za-z0-9_.-]{3,24}$/.test(username)) return fail(t("authRequired"));
      var users = loadUsers();
      if (authMode === "register"){
        if (users[username]) return fail(t("authExists"));
        var u = makeInitialUser(username, password);
        users[username] = u;
        saveUsers(users);
        setSession(username);
        App.user = u;
        App.claims = getClaims();
        toast(t("authCreated"), "success");
      } else {
        var uu = users[username];
        if (!uu || uu.pwdHash !== pwdHash(password)) return fail(t("authBad"));
        setSession(username);
        App.user = uu;
        App.claims = getClaims();
        toast(t("authOk"), "success");
      }
      App.route = "overview";
      render();
      return;
    }

    if (!App.user) return;

    if (kind === "post"){
      var text = (form.text.value || "").trim();
      if (!text) return toast(t("postEmpty"), "error");
      if (text.length > 280) return toast(t("postTooLong"), "error");
      var c = myCountry();
      App.user.posts.unshift({
        id: "post-" + Date.now() + "-" + Math.random().toString(36).slice(2,6),
        authorId: c.id,
        authorFlag: c.flag,
        authorName: {fa: c.name.fa, en: c.name.en},
        text: text,
        createdAt: Date.now(),
        likes: 0,
        isMine: true
      });
      persistCurrent();
      form.reset();
      render();
      return;
    }
    if (kind === "war"){
      var target = form.target.value;
      var justification = (form.justification.value || "").trim();
      var demands = (form.demands.value || "").trim();
      if (justification.length < 5) return toast(t("err"), "error");
      App.user.warProposals.unshift({
        id: "war-" + Date.now(),
        targetId: target,
        justification: justification,
        demands: demands,
        status: "pending",
        createdAt: Date.now(),
        history: [{at: Date.now(), status: "pending"}]
      });
      addNotif(App.user, "war", "Proposal submitted", target);
      persistCurrent();
      form.reset();
      toast(t("proposalOk"), "success");
      render();
      return;
    }
    if (kind === "chat"){
      if (!App.user.allianceId) return;
      var ctext = (form.text.value || "").trim();
      if (!ctext || ctext.length > 400) return;
      App.user.allianceMessages.unshift({
        id: "msg-" + Date.now(),
        author: App.user.username,
        text: ctext,
        createdAt: Date.now()
      });
      persistCurrent();
      form.reset();
      render();
      return;
    }
    if (kind === "ai"){
      var prompt = (form.prompt.value || "").trim();
      if (!prompt) return;
      var ares = localAdvisor(App.aiAssistant, prompt);
      App.user.aiHistory.push({assistant: App.aiAssistant, prompt: prompt, response: ares, at: Date.now()});
      persistCurrent();
      form.reset();
      render();
      return;
    }
  });
}

/* ============================================================
   BOOT
   ============================================================ */
try {
  applyLang();
  App.user = loadCurrentFromSession();
  App.claims = getClaims();
  render();
} catch(err){
  var errEl = document.getElementById("boot-error");
  if (errEl){
    errEl.style.display = "block";
    errEl.textContent = "GAME OF THE WITCHER — boot error: " + (err.message || err) + "\n" + (err.stack || "");
  }
  console.error("GOTW boot failed:", err);
}
</script>
</body>
</html>
